name: Content validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate KQL and analytics rules
        run: python scripts/validate_content.py
      - name: Verify generated content catalog
        run: python scripts/generate_catalog.py --check
