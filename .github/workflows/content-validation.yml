name: Content validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate KQL and analytics rules
        run: python scripts/validate_content.py
      - name: Verify generated content catalog
        run: python scripts/generate_catalog.py --check
