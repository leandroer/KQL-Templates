id: 5c93f1d4-f6a4-4eb7-a689-e18b2e74e2b8
name: Password spray against multiple Entra ID users
description: |
  Detects a source IP generating invalid-credential failures across many users.
  Validate failure codes and thresholds against the tenant before enabling incidents.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  let UserThreshold = 15;
  let InvalidCredentialCodes = dynamic(["50126", "50053", "50055", "50056"]);
  SigninLogs
  | where TimeGenerated > ago(1h)
  | where tostring(ResultType) in (InvalidCredentialCodes)
  | summarize StartTime=min(TimeGenerated), EndTime=max(TimeGenerated),
      FailedUsers=dcount(UserPrincipalName), Users=make_set(UserPrincipalName, 100),
      Apps=make_set(AppDisplayName, 50) by IPAddress, bin(TimeGenerated, 30m)
  | where FailedUsers >= UserThreshold
  | project TimeGenerated, StartTime, EndTime, IPAddress, FailedUsers, Users, Apps
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  FailedUsers: FailedUsers
  StartTime: StartTime
  EndTime: EndTime
alertDetailsOverride:
  alertDisplayNameFormat: "Password spray from {{IPAddress}}"
  alertDescriptionFormat: "The source attempted authentication against {{FailedUsers}} users."
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
