id: 01f3af11-b86a-4e1c-be0c-d77ad09482cc
name: High-priority service-account behavior anomaly
description: Correlates high-priority UEBA activity with identity tags or naming patterns associated with service and automation accounts.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: BehaviorAnalytics
    dataTypes: [BehaviorAnalytics, IdentityInfo]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess, Persistence]
relevantTechniques: [T1078.004]
query: |
  let MinimumPriority = 7;
  let LatestIdentity = IdentityInfo
      | where TimeGenerated > ago(14d)
      | extend IdentityUPN=tostring(column_ifexists("AccountUPN", "")),
          AccountTagsText=tostring(column_ifexists("AccountTags", ""))
      | where isnotempty(IdentityUPN)
      | summarize arg_max(TimeGenerated, *) by IdentityUPN;
  BehaviorAnalytics
  | where TimeGenerated > ago(1h) and InvestigationPriority >= MinimumPriority
  | join kind=inner LatestIdentity on $left.UserPrincipalName == $right.IdentityUPN
  | where AccountTagsText has "ServiceAccount"
      or UserPrincipalName matches regex @"(?i)(svc|service|automation|bot)[-_.]"
  | extend SourceIP=SourceIPAddress, AnomalyReason=tostring(ActivityInsights)
  | project TimeGenerated, UserPrincipalName, SourceIP, SourceDevice,
      InvestigationPriority, ActivityType, AccountTagsText, AnomalyReason
entityMappings:
  - entityType: Account
    fieldMappings: [{identifier: FullName, columnName: UserPrincipalName}]
  - entityType: IP
    fieldMappings: [{identifier: Address, columnName: SourceIP}]
  - entityType: Host
    fieldMappings: [{identifier: HostName, columnName: SourceDevice}]
customDetails:
  Priority: InvestigationPriority
  ActivityType: ActivityType
  AccountTags: AccountTagsText
alertDetailsOverride:
  alertDisplayNameFormat: "Service-account anomaly: {{UserPrincipalName}}"
  alertDescriptionFormat: "{{ActivityType}} received investigation priority {{InvestigationPriority}}."
eventGroupingSettings: {aggregationKind: AlertPerResult}
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities: [Account]
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
