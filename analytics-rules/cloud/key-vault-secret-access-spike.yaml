id: 54e6b54c-3572-4a95-81b1-782292bfa66e
name: Azure Key Vault secret access spike
description: Detects an identity retrieving an unusually high number of Key Vault secrets in a short period. Tune for deployment and automation identities.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureDiagnostics
    dataTypes: [AzureDiagnostics]
queryFrequency: 15m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess, Collection]
relevantTechniques: [T1555]
query: |
  let SecretThreshold = 20;
  AzureDiagnostics
  | where TimeGenerated > ago(30m)
  | where ResourceProvider =~ "MICROSOFT.KEYVAULT"
  | where OperationName in~ ("SecretGet", "SecretList") and ResultType =~ "Success"
  | extend CallerUPN=tostring(identity_claim_upn_s), CallerObjectId=tostring(identity_claim_oid_g),
      SourceIP=tostring(callerIpAddress_s), VaultResourceId=tostring(_ResourceId)
  | summarize StartTime=min(TimeGenerated), EndTime=max(TimeGenerated), AccessCount=count(),
      Operations=make_set(OperationName, 10) by CallerUPN, CallerObjectId, SourceIP, VaultResourceId
  | where AccessCount >= SecretThreshold
  | project EndTime, StartTime, CallerUPN, CallerObjectId, SourceIP, VaultResourceId, AccessCount, Operations
entityMappings:
  - entityType: Account
    fieldMappings: [{identifier: FullName, columnName: CallerUPN}]
  - entityType: IP
    fieldMappings: [{identifier: Address, columnName: SourceIP}]
  - entityType: AzureResource
    fieldMappings: [{identifier: ResourceId, columnName: VaultResourceId}]
customDetails:
  AccessCount: AccessCount
  CallerObjectId: CallerObjectId
alertDetailsOverride:
  alertDisplayNameFormat: "Key Vault access spike by {{CallerUPN}}"
  alertDescriptionFormat: "{{AccessCount}} secret operations were observed for {{VaultResourceId}}."
eventGroupingSettings: {aggregationKind: AlertPerResult}
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 5h
    matchingMethod: Selected
    groupByEntities: [Account, AzureResource]
    groupByAlertDetails: []
    groupByCustomDetails: []
suppressionDuration: 5h
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
